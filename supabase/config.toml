# Configuration de la CLI Supabase (`supabase start` en local, nécessite Docker).
project_id = "water-finder"

[api]
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 2000

[db]
port = 54322
major_version = 17

[auth]
site_url = "waterfinder-dev://"
additional_redirect_urls = [
  "waterfinder://**",
  "waterfinder-staging://**",
  "waterfinder-dev://**",
  "http://localhost:8081/**",
  "http://localhost:3001/**",
]
enable_signup = true
# Même règle que l'application (MIN_PASSWORD_LENGTH).
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true

[storage]
file_size_limit = "6MiB"
