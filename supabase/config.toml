# Configuration de la CLI Supabase (`supabase start` en local, nécessite Docker).
project_id = "water-finder"

# Ports en 443xx : hors de la plage dynamique de Windows (49152-65535), souvent réservée par
# Hyper-V / WSL, ce qui bloquait les ports Supabase par défaut (5432x).
[api]
port = 44321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 2000

[db]
port = 44322
shadow_port = 44320
major_version = 17

[db.pooler]
port = 44329

[studio]
port = 44323

[inbucket]
port = 44324

[analytics]
port = 44327

[auth]
site_url = "waterfinder-dev://"
additional_redirect_urls = [
  "waterfinder://**",
  "waterfinder-staging://**",
  "waterfinder-dev://**",
  "http://localhost:8081/**",
  "http://localhost:3001/**",
]
enable_signup = true
# Même règle que l'application (MIN_PASSWORD_LENGTH).
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true

[storage]
file_size_limit = "6MiB"
